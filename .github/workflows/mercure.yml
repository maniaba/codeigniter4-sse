name: Mercure Integration

on:
  pull_request:
    branches:
      - develop
    paths:
      - '**.php'
      - 'composer.*'
      - 'phpunit*'
      - '.github/workflows/mercure.yml'
  push:
    branches:
      - develop
    paths:
      - '**.php'
      - 'composer.*'
      - 'phpunit*'
      - '.github/workflows/mercure.yml'

permissions:
  contents: read

jobs:
  build:
    name: Mercure Publisher and Subscriber Integration
    runs-on: ubuntu-latest
    if: (! contains(github.event.head_commit.message, '[ci skip]'))
    services:
      mercure:
        image: dunglas/mercure:v0.24.2
        env:
          SERVER_NAME: ':80'
          MERCURE_PUBLISHER_JWT_KEY: development-publisher-key-change-before-production
          MERCURE_SUBSCRIBER_JWT_KEY: development-subscriber-key-change-before-production
          MERCURE_EXTRA_DIRECTIVES: heartbeat 1s
        ports:
          - 3000:80

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          extensions: curl, json, mbstring, xml
          coverage: none
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get composer cache directory
        run: echo "COMPOSER_CACHE_FILES_DIR=$(composer config cache-files-dir)" >> "$GITHUB_ENV"

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ env.COMPOSER_CACHE_FILES_DIR }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: |
          if [ -f composer.lock ]; then
            composer install --no-progress --no-interaction --prefer-dist --optimize-autoloader
          else
            composer update --no-progress --no-interaction --prefer-dist --optimize-autoloader
          fi

      - name: Test Mercure integration
        run: SSE_MERCURE_INTEGRATION=1 composer test -- --group integration
